const person=`<div class="hop"><svg class="flip" viewBox="0 0 46 84"><path class="pr" d="M13 30L1 82H45L33 30z" fill="#b3123a"/><line class="ba" x1="12" y1="34" x2="7" y2="54" stroke="#cf9a68" stroke-width="4.5" stroke-linecap="round"/><g class="leg l1"><line x1="17" y1="54" x2="17" y2="75" stroke="#2f5fa8" stroke-width="8" stroke-linecap="round"/><rect x="12" y="74" width="13" height="7" rx="3.5" fill="#fff" stroke="#8a8fa3" stroke-width=".8"/></g><g class="leg l2"><line x1="29" y1="54" x2="29" y2="75" stroke="#23447f" stroke-width="8" stroke-linecap="round"/><rect x="24" y="74" width="13" height="7" rx="3.5" fill="#fff" stroke="#8a8fa3" stroke-width=".8"/></g><g class="nm"><rect x="11" y="28" width="24" height="30" rx="8" fill="#2f6f73"/></g><g class="pr"><rect x="11" y="28" width="24" height="30" rx="7" fill="#1d3f9c"/><path d="M11 31L35 53" stroke="#e9b44c" stroke-width="3"/><path d="M19 28l4 8 4-8z" fill="#fff"/><circle cx="23" cy="42" r="1.4" fill="#e9b44c"/><circle cx="23" cy="48" r="1.4" fill="#e9b44c"/><rect x="11" y="53" width="24" height="3" fill="#e9b44c"/></g><g class="rd"><rect x="11" y="28" width="24" height="30" rx="8" fill="#e63946"/><rect x="11" y="47" width="24" height="5" fill="#fff"/><circle cx="23" cy="38" r="4" fill="#fff"/></g><g class="ar"><rect x="9" y="26" width="28" height="32" rx="9" fill="#f4f6fb" stroke="#b8c4dc"/><rect x="15" y="36" width="16" height="9" rx="2" fill="#4cc9f0"/><circle cx="19" cy="40.5" r="2" fill="#ff5fa2"/></g><line class="arm" x1="34" y1="34" x2="39" y2="54" stroke="#cf9a68" stroke-width="4.5" stroke-linecap="round"/><g class="hd"><circle cx="23" cy="16" r="12" fill="#cf9a68"/><path d="M11 14c2-12 22-12 24 0-6-5-18-5-24 0z" fill="#241c2e"/><g fill="rgba(255,255,255,.35)" stroke="#1f1b3a" stroke-width="1.6"><circle cx="18" cy="17.5" r="4.3"/><circle cx="28" cy="17.5" r="4.3"/></g><path d="M22.3 17.5h1.4M13.7 16.5l-2-1.5M32.3 16.5l2-1.5" stroke="#1f1b3a" stroke-width="1.4" fill="none"/><circle cx="18" cy="17.5" r="1.2" fill="#1f1b3a"/><circle cx="28" cy="17.5" r="1.2" fill="#1f1b3a"/><path d="M19 23.5q4 3 8 0" stroke="#1f1b3a" fill="none" stroke-width="1.4" stroke-linecap="round"/></g><g class="rd"><circle cx="23" cy="16" r="13" fill="#e63946"/><path d="M12 13h22v7q-11 7-22 0z" fill="#1f1b3a"/><path d="M15 15h8" stroke="#fff" stroke-width="1.5" opacity=".6"/></g><g class="ar"><circle cx="23" cy="16" r="14" fill="#f4f6fb" stroke="#b8c4dc" stroke-width="1.5"/><circle cx="23" cy="16" r="10.5" fill="#1f2d4d"/><path d="M16 12q3-5 9-4" stroke="#fff" stroke-width="1.6" fill="none" opacity=".7"/></g><g class="pr"><path d="M13 8L14 1L19 6L23 0L27 6L32 1L33 8z" fill="#e9b44c"/><circle cx="23" cy="5" r="1.2" fill="#e63946"/></g></svg></div>`;
const RANGER='<div class="rh"><svg viewBox="0 0 46 84"><g stroke="#ff5fa2" stroke-width="6" stroke-linecap="round"><line x1="18" y1="54" x2="18" y2="74"/><line x1="28" y1="54" x2="28" y2="74"/></g><rect x="13" y="74" width="10" height="8" rx="3" fill="#fff"/><rect x="23" y="74" width="10" height="8" rx="3" fill="#fff"/><g stroke="#ff5fa2" stroke-width="5" stroke-linecap="round"><line x1="12" y1="34" x2="3" y2="50"/><line x1="34" y1="34" x2="43" y2="50"/></g><circle cx="3" cy="51" r="3.5" fill="#fff"/><circle cx="43" cy="51" r="3.5" fill="#fff"/><rect x="12" y="28" width="22" height="28" rx="8" fill="#ff5fa2"/><rect x="12" y="47" width="22" height="5" fill="#fff"/><path d="M23 44l-5-5a3 3 0 0 1 5-3a3 3 0 0 1 5 3z" fill="#fff"/><circle cx="23" cy="16" r="13" fill="#ff5fa2"/><path d="M12 13h22v7q-11 7-22 0z" fill="#1f1b3a"/><path d="M15 15h8" stroke="#fff" stroke-width="1.5" opacity=".6"/></svg></div>', QUEEN='<svg viewBox="0 0 46 84"><path d="M9 14Q9 52 14 56L32 56Q37 52 37 14z" fill="#3a2a22"/><path d="M23 30L4 80H42z" fill="#8b3fb8"/><rect x="13" y="28" width="20" height="14" rx="6" fill="#8b3fb8"/><circle cx="23" cy="16" r="11" fill="#e6b794"/><circle cx="19" cy="17" r="1.3" fill="#2b2340"/><circle cx="27" cy="17" r="1.3" fill="#2b2340"/><path d="M19 22q4 3 8 0" stroke="#2b2340" fill="none" stroke-width="1.4" stroke-linecap="round"/><path d="M13 7L15 0L19 5L23 0L27 5L31 0L33 7z" fill="#e9b44c"/></svg>';
const ctl=[],OK=[];
const els=PAGES.map((p,i)=>{
 const d=document.createElement('section');
 d.className='page'+(i?' next':'');
 let stars='';if(p.night)for(let k=0;k<30;k++)stars+=`<i class="star" style="left:${Math.random()*100}%;top:${Math.random()*60}%"></i>`;
 d.innerHTML=`<h2>${p.title}</h2><p class="t">${p.text||''}</p>
 <div class="stage"${p.bg?` style="background:${p.bg}"`:''}>${stars}<div class="count">💗 0/${p.objs.length}</div><div class="floor"${p.floor?` style="background:${p.floor}"`:''}></div>${(p.deco||[]).map(q=>`<span class="dc${q[4]?' '+q[4]:''}"${q[5]?' data-m="'+q[5]+'"':''} style="left:${q[1]}%;${q[2]};font-size:${q[3]}rem">${q[0]}</span>`).join('')}${p.ranger?'<div class="rng" style="left:80%">'+RANGER+'</div>':''}${p.space?'<div class="earth">🌍</div><div class="rocket">🚀</div>':''}${p.castle?'<div class="queen" style="left:84%">'+QUEEN+'</div>':''}
 ${p.photo?'<div class="polaroid"><img src="'+FOTO+'" alt="Foto de nosotros"><div class="cap">'+p.say+'</div></div>':''}${p.panel?'<div class="panel'+(p.live?' on live':'')+(p.cls?' '+p.cls:'')+'">'+p.panel+'</div>':''}${p.objs.map((o,j)=>`<button class="obj${p.drop?' drop':''}${p.big?' big':''}${o.bg?' tk':''}${o.cls?' '+o.cls:''}" data-j="${j}" style="left:${o.x}%;animation-delay:${j*.4}s${o.bg?';background:'+o.bg:''}" aria-label="${o.say}">${o.e}</button>`).join('')}
 <div class="me" style="left:8%">${person}</div><div class="bubble"></div></div>
 <div class="how">${p.how||"👆 Toca los objetos que brillan"}</div>
 <div class="nav"><button class="prev">← Atrás</button><span>${i+1} / ${PAGES.length}</span><button class="nx">Siguiente →</button></div>`;
 book.appendChild(d);
 const st=d.querySelector('.stage'),me=d.querySelector('.me'),bub=d.querySelector('.bubble');
 let x=8,timer,bt,spaceSeq=null;
 const panel=d.querySelector('.panel');
 function go(to,cb){
  to=Math.max(8,Math.min(92,to));
  const dist=Math.abs(to-x),dur=Math.max(.3,dist/30*1.2);
  me.querySelector('.flip').style.transform=to<x?'scaleX(-1)':'scaleX(1)';
  bub.classList.remove('show');
  me.style.transitionDuration=dur+'s';
  me.style.left=to+'%';me.classList.add('walk');x=to;
  clearTimeout(timer);
  timer=setTimeout(()=>{me.classList.remove('walk');cb&&cb()},dur*1000);
 }
 function say(t){if(p.quiet)return;bub.textContent=t;bub.classList.add('show');const sh=st.clientHeight,bh=bub.offsetHeight,t0=(p.live&&panel)?panel.offsetTop+panel.offsetHeight+8:8,hd=sh-sh*.17-me.offsetHeight-6;if(p.live||p.space){bub.style.top='auto';bub.style.bottom='6px'}else{bub.style.bottom='auto';bub.style.top=Math.max(t0,(t0+hd)/2-bh/2)+'px'}clearTimeout(bt);bt=setTimeout(()=>bub.classList.remove('show'),5000)}
 const hop=me.querySelector('.hop'),cnt=d.querySelector('.count');let found=0;
 const anim=c=>{hop.classList.remove(c);void hop.offsetWidth;hop.classList.add(c)};
 const hearts=n=>{for(let k=0;k<n;k++){const h=document.createElement('span');h.className='heart';h.textContent=['💗','💖','✨'][k%3];h.style.left=(x+Math.random()*10-5)+'%';h.style.bottom=(40+Math.random()*10)+'%';st.appendChild(h);setTimeout(()=>h.remove(),1400)}};
 const lines=["¡Hola, preciosa! 👋","Me haces muy feliz","Eres lo mejor de mi día","Jaja, cosquillas","Te iba a traer flores 🌹","¡Otra vez! 😄"];
 const howEl=d.querySelector('.how');
 const done=()=>{OK[i]=1;if(panel){panel.classList.add('on');bub.classList.remove('show');clearTimeout(bt)}if(i<PAGES.length-1){const nx=d.querySelector('.nx');nx.disabled=false;nx.classList.add('pulse');}else howEl.textContent='💗 Eso es todo. Gracias por llegar hasta aquí'};
 function grab(j){const b=d.querySelector('.obj[data-j="'+j+'"]');if(b.classList.contains('done'))return false;
  b.classList.add('done');found++;cnt.textContent='💗 '+found+'/'+p.objs.length;anim('jump');hearts(p.space?16:4);say(p.objs[j].say);
  if(found===p.objs.length)setTimeout(()=>{anim('dance');hearts(10);(spaceSeq||done)()},1800);
  return true}
 // el mensaje/panel solo aparece cuando el chico LLEGA al objeto
 const toObj=j=>go(p.objs[j].x,()=>{if(!grab(j))say(p.objs[j].say)});
 me.onclick=e=>{e.stopPropagation();anim('jump');hearts(3);say(lines[Math.floor(Math.random()*lines.length)])};
 if(panel)panel.onclick=e=>e.stopPropagation();
 const pol=d.querySelector('.polaroid');
 if(!p.objs.length)cnt.remove();
 if(p.wave)me.classList.add('wave');
 let act=null;
 howEl.onclick=()=>{if(act)act()};
 const walkTo=(to,dur,cb)=>{me.querySelector('.flip').style.transform=to<x?'scaleX(-1)':'scaleX(1)';me.style.transitionDuration=dur+'s';me.classList.add('walk');me.style.left=to+'%';x=to;setTimeout(()=>{me.classList.remove('walk');cb&&cb()},dur*1000)};
 if(p.photo){let pd=0;act=()=>{if(pd)return;pd=1;go(50,()=>{pol.classList.add('on');anim('jump');hearts(10);setTimeout(()=>walkTo(125,3,()=>{anim('dance');hearts(6);done()}),1800)})};pol.onclick=e=>{e.stopPropagation();act()}}
 const rng=d.querySelector('.rng'),queen=d.querySelector('.queen');let once=0;
 if(p.ranger){act=()=>go(69,()=>{if(once)return;once=1;rng.querySelector('.rh').classList.add('jump');hearts(14);say('💋');setTimeout(()=>walkTo(-15,2.2,()=>{me.classList.add('red');setTimeout(()=>walkTo(69,2.4,()=>{me.querySelector('.flip').style.transform='scaleX(1)';hearts(12);anim('jump');say('Sé que puedes sola, pero no lo estás 💗');setTimeout(done,5200)}),500)}),1400)})}
 if(p.castle){act=()=>{if(once)return;once=1;go(68,()=>{
   say('Toc, toc 🚪');anim('jump');
   setTimeout(()=>{queen.classList.add('on');hearts(8);say('¡Mi reina! 👑')},1300);
   setTimeout(()=>say('Ya vuelvo... 😏'),3200);
   setTimeout(()=>walkTo(-15,2.4,()=>{me.classList.add('prince');setTimeout(()=>walkTo(68,2.6,()=>{me.querySelector('.flip').style.transform='scaleX(1)';hop.classList.add('kneel');hearts(14);say('Un príncipe solo se arrodilla ante su reina 👑');setTimeout(()=>{bub.classList.remove('show');clearTimeout(bt);panel.classList.add('on')},5000)}),500)}),4200)})}}
 if(p.space){const earth=d.querySelector('.earth'),rocket=d.querySelector('.rocket');spaceSeq=()=>{
  setTimeout(()=>earth.classList.add('on'),600);
  setTimeout(()=>walkTo(-15,2.2,()=>{me.classList.add('astro');setTimeout(()=>walkTo(70,2.6,()=>{anim('jump');setTimeout(()=>{me.style.opacity=0;const rr=rocket.getBoundingClientRect(),er=earth.getBoundingClientRect();rocket.style.transform='translate(calc(-50% + '+(er.left+er.width/2-rr.left-rr.width/2)+'px),'+(er.top+er.height/2-rr.top-rr.height/2)+'px) scale(.3)';hearts(6);setTimeout(()=>{rocket.style.opacity=0;earth.innerHTML='🌍<span style="position:absolute;left:50%;top:-18px;transform:translateX(-50%);font-size:1.7rem">🧑‍🚀</span>';hearts(14);say('Por ti voy hasta el fin del mundo 🌍💗');setTimeout(done,5200)},2700)},500)}),500)}),1500)}}
 if(p.live){const cv2=d.querySelectorAll('.cdv');const upd=()=>{const t=Math.max(0,Date.now()-DESDE.getTime())/1000;[Math.floor(t/86400),Math.floor(t%86400/3600),Math.floor(t%3600/60),Math.floor(t%60)].forEach((v,k)=>cv2[k].textContent=v)};upd();setInterval(upd,1000)}
 if(p.ask){const no=d.querySelector('.no'),yes=d.querySelector('.yes');
  const run=e=>{e.preventDefault();e.stopPropagation();no.style.transform='translate('+(Math.random()*160-80)+'px,'+(Math.random()*80-40)+'px)'};
  no.addEventListener('pointerenter',run);no.addEventListener('click',run);no.addEventListener('touchstart',run,{passive:false});
  yes.onclick=e=>{e.stopPropagation();hearts(14);anim('dance');say('¡Lo sabía! Te amo 💗');yes.textContent='¡Sí! 💗';setTimeout(done,1200)}}
 ctl[i]={step:dx=>act?act():go(x+dx),jump:()=>{anim('jump');hearts(2)}};
 d.querySelectorAll('.obj').forEach(b=>b.onclick=e=>{e.stopPropagation();toObj(+b.dataset.j)});
 st.addEventListener('click',e=>{
  if(act){act();return}
  const t=e.target.closest('.dc[data-m]');if(t){go(parseFloat(t.style.left),()=>{say(t.dataset.m);hearts(5);anim('jump')});return}
  const r=st.getBoundingClientRect();go((e.clientX-r.left)/r.width*100);
 });
 d.querySelector('.prev').onclick=()=>show(cur-1);
 d.querySelector('.nx').onclick=()=>show(cur+1);
 d.querySelector('.prev').disabled=i==0;
 d.querySelector('.nx').disabled=true;if(i==PAGES.length-1)d.querySelector('.nx').style.visibility='hidden';
 return d;
});
function show(n){
 if(n<0||n>=PAGES.length||document.getElementById('welcome')||(n>cur&&!OK[cur]))return;
 els.forEach((d,i)=>{d.classList.toggle('gone',i<n);d.classList.toggle('next',i>n)});
 cur=n;
}
document.addEventListener('keydown',e=>{if(document.getElementById('welcome')||document.getElementById('cover'))return;const c=ctl[cur];if(e.key==='ArrowRight')c.step(14);else if(e.key==='ArrowLeft')c.step(-14);else if(e.key===' '){e.preventDefault();c.jump()}});
let sx=null;
book.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
book.addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>70)show(cur+(dx<0?1:-1));sx=null});
show(0);
// botón de sonido
const mb=document.createElement('button');mb.id='mute';mb.textContent='🔊';mb.setAttribute('aria-label','Silenciar música');
mb.onclick=()=>{bg.muted=!bg.muted;mb.textContent=bg.muted?'🔇':'🔊'};
document.body.appendChild(mb);
let st2='';for(let k=0;k<30;k++)st2+='<i class="star" style="left:'+Math.random()*100+'%;top:'+Math.random()*55+'%"></i>';
const w=document.createElement('section');w.className='page welcome';w.id='welcome';
w.innerHTML='<div style="font-size:3rem">💌</div><h2>Bienvenida, '+PARA+'</h2><p class="t">'+BIENVENIDA+'</p><button class="go">Abrir</button>';
w.querySelector('.go').onclick=()=>{bg.play().catch(()=>{});w.removeAttribute('id');w.classList.add('gone');setTimeout(()=>w.remove(),1000)};
book.appendChild(w);
const cv=document.createElement('div');cv.id='cover';
cv.innerHTML='<h1>Nuestra historia</h1><p style="margin:10px 0 0;opacity:.85">Un libro hecho solo para '+PARA+'</p><div class="cst">'+st2+'<div class="floor"></div><div class="me" style="left:-12%">'+person+'</div></div>';
book.appendChild(cv);
const cme=cv.querySelector('.me'),chop=cv.querySelector('.hop');let T=[];
const at=(ms,fn)=>T.push(setTimeout(fn,ms));
const openCv=()=>{T.forEach(clearTimeout);cme.classList.remove('walk');cv.classList.add('open');setTimeout(()=>cv.remove(),2000)};
at(600,()=>{cme.style.transitionDuration='2.4s';cme.classList.add('walk');cme.style.left='50%'});
at(3100,()=>{cme.classList.remove('walk');chop.classList.add('jump')});
at(3800,()=>{chop.classList.remove('jump');void chop.offsetWidth;chop.classList.add('jump')});
at(4500,openCv);
cv.onclick=openCv;
</script>
</body>
</html>
